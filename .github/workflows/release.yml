name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/Win11ControlCenter.App/Win11ControlCenter.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/Win11ControlCenter-win-x64

      - name: Package release ZIP
        run: Compress-Archive -Path artifacts/Win11ControlCenter-win-x64/* -DestinationPath artifacts/Win11ControlCenter-win-x64.zip
        shell: pwsh

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            } else {
              choco install innosetup -y
              $iscc = $defaultPath
            }
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DSourceDir=${{ github.workspace }}\artifacts\Win11ControlCenter-win-x64" "installer\Win11ControlCenter.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksums
        id: checksums
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash "artifacts/Win11ControlCenter-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash "artifacts/Win11ControlCenter-Setup-win-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  Win11ControlCenter-win-x64.zip"
            "$exeHash  Win11ControlCenter-Setup-win-x64.exe"
          ) | Set-Content -Path "artifacts/SHA256SUMS.txt" -Encoding utf8
          "zip_sha256=$zipHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_sha256=$exeHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### Downloads
            - **Installer (`Win11ControlCenter-Setup-win-x64.exe`)**: Standard Windows installer (Start Menu shortcut, optional Desktop icon, clean uninstaller).
            - **Portable (`Win11ControlCenter-win-x64.zip`)**: Extract and run `Win11ControlCenter.App.exe` directly without installing.

            > **SmartScreen Notice (Unsigned Open-Source Build)**
            > Releases are compiled directly from source via GitHub Actions without a commercial Authenticode certificate, so Windows Defender SmartScreen may display *"Windows protected your PC"*. Click **More info → Run anyway** (or run `Unblock-File .\Win11ControlCenter-Setup-win-x64.exe`), and verify the SHA-256 hash below against `SHA256SUMS.txt`.

            ### SHA-256 Checksums
            ```text
            Win11ControlCenter-Setup-win-x64.exe : ${{ steps.checksums.outputs.exe_sha256 }}
            Win11ControlCenter-win-x64.zip       : ${{ steps.checksums.outputs.zip_sha256 }}
            ```

            Verify in PowerShell:
            ```powershell
            Get-FileHash .\Win11ControlCenter-Setup-win-x64.exe -Algorithm SHA256
            ```
          files: |
            artifacts/Win11ControlCenter-win-x64.zip
            artifacts/Win11ControlCenter-Setup-win-x64.exe
            artifacts/SHA256SUMS.txt

