name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/Win11ControlCenter.App/Win11ControlCenter.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/Win11ControlCenter-win-x64

      - name: Package release ZIP
        run: Compress-Archive -Path artifacts/Win11ControlCenter-win-x64/* -DestinationPath artifacts/Win11ControlCenter-win-x64.zip
        shell: pwsh

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            } else {
              choco install innosetup -y
              $iscc = $defaultPath
            }
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DSourceDir=${{ github.workspace }}\artifacts\Win11ControlCenter-win-x64" "installer\Win11ControlCenter.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/Win11ControlCenter-win-x64.zip
            artifacts/Win11ControlCenter-Setup-win-x64.exe

