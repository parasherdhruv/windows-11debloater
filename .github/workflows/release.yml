name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/Win11ControlCenter.App/Win11ControlCenter.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/Win11ControlCenter-win-x64

      - name: Package release ZIP
        run: Compress-Archive -Path artifacts/Win11ControlCenter-win-x64/* -DestinationPath artifacts/Win11ControlCenter-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/Win11ControlCenter-win-x64.zip
